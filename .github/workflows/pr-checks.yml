name: Pull request checks

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run test suite
        run: node --test server/*.test.js server/lib/*.test.js tests/*.test.js

      - name: Build browser application
        run: npm run build

      - name: Confirm production build does not expose source maps
        run: |
          if find dist -type f -name '*.map' | grep -q .; then
            echo 'Production build emitted source maps into dist.' >&2
            find dist -type f -name '*.map' >&2
            exit 1
          fi
