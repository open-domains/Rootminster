name: Upload GlitchTip sourcemaps
description: Inject debug IDs and upload browser sourcemaps to GlitchTip

inputs:
  url:
    description: Base URL of the GlitchTip instance
    required: true
  auth-token:
    description: GlitchTip API token with release upload permission
    required: true
  organization:
    description: GlitchTip organization slug
    required: true
  project:
    description: GlitchTip project slug
    required: true
  release:
    description: Release identifier compiled into the browser bundle
    required: true
  path:
    description: Directory containing built JavaScript and sourcemaps
    required: false
    default: ./dist

runs:
  using: composite
  steps:
    - name: Install GlitchTip CLI
      shell: bash
      env:
        # Pinned release and checksum. To upgrade, download the new
        # linux-x86_64 asset from https://gitlab.com/glitchtip/glitchtip-cli/-/releases
        # and update both values.
        GLITCHTIP_CLI_VERSION: v1.0.0
        GLITCHTIP_CLI_SHA256: de1c035aa61931a6265d7b29b1614781dfee925466142a907508cb097082dfef
      run: |
        set -euo pipefail
        bin="${RUNNER_TEMP}/glitchtip-cli"
        curl -fsSL --retry 3 -o "$bin" \
          "https://gitlab.com/glitchtip/glitchtip-cli/-/jobs/artifacts/${GLITCHTIP_CLI_VERSION}/raw/artifacts/glitchtip-cli-linux-x86_64?job=build-linux-x86_64"
        echo "${GLITCHTIP_CLI_SHA256}  ${bin}" | sha256sum --check --strict
        chmod +x "$bin"
        echo "GLITCHTIP_CLI=$bin" >> "$GITHUB_ENV"

    - name: Inject debug IDs and upload sourcemaps
      shell: bash
      env:
        SENTRY_URL: ${{ inputs.url }}
        SENTRY_AUTH_TOKEN: ${{ inputs.auth-token }}
        SENTRY_ORG: ${{ inputs.organization }}
        SENTRY_PROJECT: ${{ inputs.project }}
        SOURCEMAP_PATH: ${{ inputs.path }}
        GLITCHTIP_RELEASE: ${{ inputs.release }}
      run: |
        set -euo pipefail
        "$GLITCHTIP_CLI" sourcemaps inject "$SOURCEMAP_PATH"
        "$GLITCHTIP_CLI" sourcemaps upload "$SOURCEMAP_PATH" \
          --release "$GLITCHTIP_RELEASE" \
          --org "$SENTRY_ORG" \
          --project "$SENTRY_PROJECT"
